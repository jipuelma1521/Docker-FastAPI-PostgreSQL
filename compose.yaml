services:
  db:
    image: postgres:latest
    container_name: postgres-docker
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  api:
    build: .
    container_name: fastapi-docker
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db

volumes:
  postgres-data:
    external: true